<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Acme Productivity App — streamline your workflow with our all-in-one productivity solution."
    />
    <title>Acme — Boost Your Productivity</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
            colors: {
              brand: {
                dark: "#1A1A2E",
                accent: "#6366F1",
              },
            },
          },
        },
      };
    </script>
  </head>

  <body class="min-h-screen bg-[#F8F8FD] font-sans text-slate-900 antialiased">


      <!-- ============================================================
           Dev 3: Contact Section + Footer
           ============================================================ -->
      <section id="contact" class="px-4 pb-12 pt-4 sm:px-6 sm:pb-16 lg:px-8">
        <div class="mx-auto max-w-4xl">
          <!-- Contact card -->
          <article class="rounded-3xl bg-white px-6 py-12 shadow-sm sm:px-12 sm:py-16">
            <h2 class="text-center text-2xl font-bold text-brand-dark sm:text-3xl">
              Get in Touch
            </h2>

            <form
              class="mx-auto mt-10 max-w-lg space-y-6"
              action="#"
              method="post"
              aria-label="Contact form"
            >
              <!-- Name -->
              <div>
                <label for="name" class="mb-1.5 block text-sm text-gray-500">Name</label>
                <input
                  type="text"
                  id="name"
                  name="name"
                  placeholder="John Doe"
                  required
                  class="w-full rounded-lg border border-gray-200 px-4 py-3 text-slate-900 placeholder:text-gray-400 transition-colors focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
                />
              </div>

              <!-- Email -->
              <div>
                <label for="email" class="mb-1.5 block text-sm text-gray-500">Email</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="john@example.com"
                  required
                  class="w-full rounded-lg border border-gray-200 px-4 py-3 text-slate-900 placeholder:text-gray-400 transition-colors focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
                />
              </div>

              <!-- Message -->
              <div>
                <label for="message" class="mb-1.5 block text-sm text-gray-500">Message</label>
                <textarea
                  id="message"
                  name="message"
                  rows="5"
                  placeholder="Your message..."
                  required
                  class="w-full resize-y rounded-lg border border-gray-200 px-4 py-3 text-slate-900 placeholder:text-gray-400 transition-colors focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
                ></textarea>
              </div>

              <!-- Submit -->
              <button
                type="submit"
                class="w-full rounded-lg bg-brand-dark py-3.5 text-sm font-bold text-white transition-colors hover:bg-slate-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-600 focus-visible:ring-offset-2"
              >
                Submit
              </button>
            </form>
          </article>

          <!-- Footer -->
          <footer
            class="mt-8 flex flex-col items-center justify-between gap-4 px-2 text-sm sm:flex-row sm:items-center"
          >
            <p class="text-gray-500">Acme productivity app ©2024</p>

            <nav aria-label="Footer navigation">
              <ul class="flex flex-wrap items-center justify-center gap-6 sm:gap-8">
                <li>
                  <a
                    href="#faq"
                    class="font-bold text-brand-dark transition-colors hover:text-indigo-600 focus:outline-none focus-visible:text-indigo-600"
                  >
                    FAQ
                  </a>
                </li>
                <li>
                  <a
                    href="#terms"
                    class="font-bold text-brand-dark transition-colors hover:text-indigo-600 focus:outline-none focus-visible:text-indigo-600"
                  >
                    Terms
                  </a>
                </li>
                <li>
                  <a
                    href="#ai-policy"
                    class="font-bold text-brand-dark transition-colors hover:text-indigo-600 focus:outline-none focus-visible:text-indigo-600"
                  >
                    AI Policy
                  </a>
                </li>
                <li>
                  <a
                    href="#pricing"
                    class="font-bold text-brand-dark transition-colors hover:text-indigo-600 focus:outline-none focus-visible:text-indigo-600"
                  >
                    Pricing
                  </a>
                </li>
              </ul>
            </nav>
          </footer>
        </div>
      </section>
    </main>
  </body>
</html>
