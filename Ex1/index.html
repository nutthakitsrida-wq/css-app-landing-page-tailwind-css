<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browse by Job Categories</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>

  <body class="min-h-screen bg-[#F8F8FD] font-sans text-slate-900 antialiased">
    <main>
      <section
        id="job-categories"
        class="px-4 py-12 sm:px-6 lg:px-8"
        aria-labelledby="job-categories-title"
      >
        <div class="mx-auto max-w-7xl">
          <header class="text-center">
            <h2
              id="job-categories-title"
              class="inline-block text-2xl font-bold text-[#101828] sm:text-3xl md:text-4xl"
            >
              Browse by
              <span class="relative mx-2 inline-block text-[#101828]">
                Job
                <span
                  aria-hidden="true"
                  class="absolute inset-x-0 bottom-0 h-5 translate-y-[2px] rounded-sm bg-[#FF7F50]/30"
                ></span>
              </span>
              Categories
            </h2>
          </header>

          <div class="mt-12 grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-4">
            <!-- Digital Marketing -->
            <article>
              <a
                href="#"
                class="group flex h-full flex-col justify-between rounded-2xl border border-gray-100 bg-white p-6 shadow-sm transition-all duration-300 hover:shadow-md"
                aria-label="Digital Marketing jobs opened"
              >
                <div>
                  <div class="mb-6 flex h-12 w-12 items-center justify-center rounded-full bg-orange-50">
                    <svg
                      class="h-6 w-6 text-[#FF7F50]"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      viewBox="0 0 24 24"
                      aria-hidden="true"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"
                      />
                    </svg>
                  </div>
                  <h3 class="mb-1 text-lg font-bold text-[#101828]">Digital Marketing</h3>
                  <p class="text-sm text-gray-500">143 Jobs Opened</p>
                </div>

                <div class="mt-6 flex justify-end text-gray-400 transition-colors duration-300 group-hover:text-[#FF7F50]">
                  <span aria-hidden="true">-&gt;</span>
                </div>
              </a>
            </article>

            <!-- Art & Design -->
            <article>
              <a
                href="#"
                class="group flex h-full flex-col justify-between rounded-2xl border border-gray-100 bg-white p-6 shadow-sm transition-all duration-300 hover:shadow-md"
                aria-label="Art and Design jobs opened"
              >
                <div>
                  <div class="mb-6 flex h-12 w-12 items-center justify-center rounded-full bg-orange-50">
                    <svg
                      class="h-6 w-6 text-[#FF7F50]"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      viewBox="0 0 24 24"
                      aria-hidden="true"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"
                      />
                    </svg>
                  </div>
                  <h3 class="mb-1 text-lg font-bold text-[#101828]">Art &amp; Design</h3>
                  <p class="text-sm text-gray-500">110 Jobs Opened</p>
                </div>

                <div class="mt-6 flex justify-end text-gray-400 transition-colors duration-300 group-hover:text-[#FF7F50]">
                  <span aria-hidden="true">-&gt;</span>
                </div>
              </a>
            </article>

            <!-- Accounting (active) -->
            <article>
              <a
                href="#"
                class="group flex h-full flex-col justify-between rounded-2xl border border-gray-200 bg-gray-50 p-6 shadow-sm transition-all duration-300 hover:bg-gray-100 hover:shadow-md"
                aria-label="Accounting jobs opened"
              >
                <div>
                  <div class="mb-6 flex h-12 w-12 items-center justify-center rounded-full bg-orange-500">
                    <svg
                      class="h-6 w-6 text-white"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      viewBox="0 0 24 24"
                      aria-hidden="true"
                    >
                      <path stroke-linecap="round" stroke-linejoin="round" d="M12 1v22" />
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M17 5H9.5a3.5 3.5 0 000 7H14a3.5 3.5 0 010 7H7"
                      />
                    </svg>
                  </div>
                  <h3 class="mb-1 text-lg font-bold text-[#101828]">Accounting</h3>
                  <p class="text-sm text-gray-500">158 Jobs Opened</p>
                </div>

                <div class="mt-6 flex justify-end text-[#FF7F50]">
                  <span aria-hidden="true">-&gt;</span>
                </div>
              </a>
            </article>

            <!-- Photography -->
            <article>
              <a
                href="#"
                class="group flex h-full flex-col justify-between rounded-2xl border border-gray-100 bg-white p-6 shadow-sm transition-all duration-300 hover:shadow-md"
                aria-label="Photography jobs opened"
              >
                <div>
                  <div class="mb-6 flex h-12 w-12 items-center justify-center rounded-full bg-orange-50">
                    <svg
                      class="h-6 w-6 text-[#FF7F50]"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      viewBox="0 0 24 24"
                      aria-hidden="true"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"
                      />
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"
                      />
                    </svg>
                  </div>
                  <h3 class="mb-1 text-lg font-bold text-[#101828]">Photography</h3>
                  <p class="text-sm text-gray-500">95 Jobs Opened</p>
                </div>

                <div class="mt-6 flex justify-end text-gray-400 transition-colors duration-300 group-hover:text-[#FF7F50]">
                  <span aria-hidden="true">-&gt;</span>
                </div>
              </a>
            </article>

            <!-- Copy Writing -->
            <article>
              <a
                href="#"
                class="group flex h-full flex-col justify-between rounded-2xl border border-gray-100 bg-white p-6 shadow-sm transition-all duration-300 hover:shadow-md"
                aria-label="Copy Writing jobs opened"
              >
                <div>
                  <div class="mb-6 flex h-12 w-12 items-center justify-center rounded-full bg-orange-50">
                    <svg
                      class="h-6 w-6 text-[#FF7F50]"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      viewBox="0 0 24 24"
                      aria-hidden="true"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
                      />
                    </svg>
                  </div>
                  <h3 class="mb-1 text-lg font-bold text-[#101828]">Copy Writing</h3>
                  <p class="text-sm text-gray-500">113 Jobs Opened</p>
                </div>

                <div class="mt-6 flex justify-end text-gray-400 transition-colors duration-300 group-hover:text-[#FF7F50]">
                  <span aria-hidden="true">-&gt;</span>
                </div>
              </a>
            </article>

            <!-- Music -->
            <article>
              <a
                href="#"
                class="group flex h-full flex-col justify-between rounded-2xl border border-gray-100 bg-white p-6 shadow-sm transition-all duration-300 hover:shadow-md"
                aria-label="Music jobs opened"
              >
                <div>
                  <div class="mb-6 flex h-12 w-12 items-center justify-center rounded-full bg-orange-50">
                    <svg
                      class="h-6 w-6 text-[#FF7F50]"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      viewBox="0 0 24 24"
                      aria-hidden="true"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"
                      />
                    </svg>
                  </div>
                  <h3 class="mb-1 text-lg font-bold text-[#101828]">Music</h3>
                  <p class="text-sm text-gray-500">143 Jobs Opened</p>
                </div>

                <div class="mt-6 flex justify-end text-gray-400 transition-colors duration-300 group-hover:text-[#FF7F50]">
                  <span aria-hidden="true">-&gt;</span>
                </div>
              </a>
            </article>

            <!-- Human Resources -->
            <article>
              <a
                href="#"
                class="group flex h-full flex-col justify-between rounded-2xl border border-gray-100 bg-white p-6 shadow-sm transition-all duration-300 hover:shadow-md"
                aria-label="Human Resources jobs opened"
              >
                <div>
                  <div class="mb-6 flex h-12 w-12 items-center justify-center rounded-full bg-orange-50">
                    <svg
                      class="h-6 w-6 text-[#FF7F50]"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      viewBox="0 0 24 24"
                      aria-hidden="true"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"
                      />
                    </svg>
                  </div>
                  <h3 class="mb-1 text-lg font-bold text-[#101828]">Human Resources</h3>
                  <p class="text-sm text-gray-500">55 Jobs Opened</p>
                </div>

                <div class="mt-6 flex justify-end text-gray-400 transition-colors duration-300 group-hover:text-[#FF7F50]">
                  <span aria-hidden="true">-&gt;</span>
                </div>
              </a>
            </article>

            <!-- Explore 30 More Categories (last tile) -->
            <article>
              <a
                href="#"
                class="relative flex h-full flex-col justify-between overflow-hidden rounded-2xl bg-[#FF7F50] p-6 text-white shadow-md transition-all duration-300 hover:shadow-lg"
                aria-label="Explore 30 more job categories"
              >
                <div class="absolute inset-0 opacity-20 pointer-events-none">
                  <svg viewBox="0 0 100 100" preserveAspectRatio="none" class="h-full w-full" aria-hidden="true">
                    <path d="M0,50 Q25,70 50,50 T100,50 L100,100 L0,100 Z" fill="white"></path>
                    <path
                      d="M0,60 Q30,40 60,70 T100,60 L100,100 L0,100 Z"
                      fill="white"
                      opacity="0.5"
                    ></path>
                  </svg>
                </div>

                <div class="relative z-10">
                  <div class="mb-6 flex h-12 w-12 items-center justify-center rounded-full bg-white/20">
                    <svg
                      class="h-6 w-6 text-white"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      viewBox="0 0 24 24"
                      aria-hidden="true"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"
                      />
                    </svg>
                  </div>

                  <h3 class="text-xl font-bold leading-tight">
                    Explore 30 More<br />
                    Categories
                  </h3>
                </div>

                <div class="relative z-10 mt-6 flex justify-end">
                  <span aria-hidden="true" class="font-semibold">-&gt;</span>
                </div>
              </a>
            </article>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
